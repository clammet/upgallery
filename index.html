<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preload" href="/config.json" as="fetch" crossorigin="anonymous" />
    <script id="gallery-theme-bootstrap">
      // Runs before stylesheets and React, and also handles in-app navigation.
      (() => {
        // v1 stored individual visited paths, which cannot identify gallery roots.
        const key = "upgallery:themes:v2";
        const maxAge = 30 * 24 * 60 * 60 * 1000;
        const properties = [
          "color-scheme", "--gallery-accent", "--gallery-secondary",
          "--gallery-bg", "--gallery-fg", "--gallery-surface", "--gallery-muted",
          "--gallery-header-divider", "--gallery-cell-border", "--gallery-radius",
          "--gallery-gap", "--thumbnail-frame-size", "--shadow",
        ];
        const isGalleryPath = () => !/^\/(admin|auth)(\/|$)/i.test(location.pathname);
        const matches = (rootPath) => {
          const path = location.pathname;
          // Explicit gallery URLs must never inherit a host gallery's theme.
          const slugRoute = path.match(/^\/(?:g|up)\/[^/]+/i)?.[0];
          if (slugRoute && rootPath !== slugRoute) return false;
          return rootPath === "/" || path === rootPath || path.startsWith(rootPath + "/");
        };
        const read = () => {
          try {
            const entries = JSON.parse(localStorage.getItem(key) || "[]");
            const now = Date.now();
            return Array.isArray(entries) ? entries.filter((entry) =>
              entry && typeof entry.rootPath === "string" &&
              entry.rootPath.startsWith("/") &&
              typeof entry.savedAt === "number" &&
              entry.savedAt <= now && now - entry.savedAt < maxAge &&
              entry.values && properties.every((name) =>
                typeof entry.values[name] === "string" &&
                entry.values[name].length <= 256
              ) && ["light", "dark"].includes(entry.values["color-scheme"])
            ).slice(0, 20) : [];
          } catch {
            return [];
          }
        };
        const write = (entries) => {
          try {
            localStorage.setItem(key, JSON.stringify(entries));
          } catch {
            // Storage can be unavailable or full; live themes still work.
          }
        };
        const apply = (values) => {
          for (const name of properties) {
            if (values) document.documentElement.style.setProperty(name, values[name]);
            else document.documentElement.style.removeProperty(name);
          }
        };
        const current = () => isGalleryPath() && read()
          .filter((entry) => matches(entry.rootPath))
          .sort((a, b) => b.rootPath.length - a.rootPath.length)[0];
        window.upgalleryTheme = {
          restore() {
            const entry = current();
            apply(entry ? entry.values : null);
          },
          save(rootPath, values) {
            rootPath = rootPath.replace(/\/+$/, "") || "/";
            if (!isGalleryPath() || !matches(rootPath)) return;
            apply(values);
            write([
              { rootPath, savedAt: Date.now(), values },
              ...read().filter((entry) => entry.rootPath !== rootPath),
            ].slice(0, 20));
          },
          clear() {
            apply(null);
            // Forget routes that no longer resolve to a gallery.
            const entry = current();
            if (entry) write(read().filter((cached) => cached.rootPath !== entry.rootPath));
          },
        };
        window.upgalleryTheme.restore();
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Minimal multi-gallery file hosting" />
    <title>upgallery</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
