---
name: Maintenance watchdog

on:
  schedule:
    - cron: "16 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: write
  actions: write

concurrency:
  group: maintenance-watchdog
  cancel-in-progress: false


jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: yuzuyuzuyu/repo-automation/actions/watchdog@4d9d2190e00f1623c68eff7c30b703ce53dfcf8d # v1.0.34
