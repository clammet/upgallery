name: Convex deploy

# Deploys the functions, crons, and auth config in convex/ to the hosted
# Convex deployment identified by the CONVEX_DEPLOY_KEY secret (generate a
# production deploy key in the Convex dashboard under Settings → Deploy keys).
#
# Manual-only for now: the service is not live yet, so this is intentionally
# decoupled from the Docker image build. Once a production Convex deployment
# exists, uncomment the push trigger below to deploy on every main push.

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

concurrency:
  group: convex-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy key is configured
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::error::CONVEX_DEPLOY_KEY secret is not set." \
              "Create a deploy key in the Convex dashboard and add it under" \
              "Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to Convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: pnpm exec convex deploy
