name: Convex / Production deploy

# Deploys only the functions, crons, schema, and auth config in convex/ to the
# dedicated self-hosted production deployment. Deployment environment values
# are managed separately; a code deploy does not rewrite them.
#
# Docker images calls this workflow before publishing images for its commit.
# The manual trigger remains available for an explicit backend-only redeploy.

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      CONVEX_SELF_HOSTED_ADMIN_KEY:
        required: true
    outputs:
      deployed-commit:
        description: Commit whose Convex deployment completed successfully
        value: ${{ jobs.deploy.outputs.deployed-commit }}

concurrency:
  group: convex-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publication-ready:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the current revision and its CI
        id: gate
        uses: yuzuyuzuyu/repo-automation/actions/publication@6e801d2cced54f12b0690bcca98ea92a8adc1048 # v1.0.13

  deploy:
    needs: publication-ready
    if: needs.publication-ready.outputs.ready == 'true' && (github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      deployed-commit: ${{ steps.deploy.outputs.commit }}
    environment:
      name: production
      url: https://upgallery.nyanya.org
    env:
      # Keep the target visible and reviewable in source. The admin key is the
      # only production credential this workflow needs.
      CONVEX_SELF_HOSTED_URL: https://upgallery-convex.nyanya.org
    steps:
      - name: Check production target and admin key
        env:
          CONVEX_SELF_HOSTED_ADMIN_KEY: ${{ secrets.CONVEX_SELF_HOSTED_ADMIN_KEY }}
        run: |
          if [ "$CONVEX_SELF_HOSTED_URL" != "https://upgallery-convex.nyanya.org" ]; then
            echo "::error::Refusing unexpected production target: $CONVEX_SELF_HOSTED_URL"
            exit 1
          fi
          if [ -z "$CONVEX_SELF_HOSTED_ADMIN_KEY" ]; then
            echo "::error::CONVEX_SELF_HOSTED_ADMIN_KEY is not set in the production environment."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The deployed functions report this commit through system.deploymentStatus
      # so the admin panel can compare it against the web and storage builds.
      - name: Stamp deployed commit
        run: printf 'export const GIT_COMMIT = "%s";\n' "${GITHUB_SHA}" > convex/buildInfo.ts

      - name: Deploy to Convex
        id: deploy
        env:
          CONVEX_SELF_HOSTED_ADMIN_KEY: ${{ secrets.CONVEX_SELF_HOSTED_ADMIN_KEY }}
        run: |
          pnpm exec convex deploy --message "GitHub Actions ${GITHUB_SHA}"
          echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
