name: CI

# Validates every pull request (including Renovate's automated dependency
# bumps) with the typecheck, test suite, and production builds. The Docker
# image build in docker.yml also runs on pull requests and is the check that
# actually exercises the sharp/libvips/HEIC stack.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm

      # The storage tests shell out to ffmpeg (present in the production
      # image via apk, but not on the hosted runner). Azure's apt mirror
      # intermittently blackholes connections when many jobs start at once
      # and apt's own timeouts don't always fire, so bound each command with
      # timeout(1) and retry against the canonical Ubuntu mirror. A healthy
      # install takes ~2 minutes.
      - name: Install ffmpeg
        timeout-minutes: 15
        run: |
          install_ffmpeg() {
            sudo timeout 120 apt-get update -qq -o Acquire::ForceIPv4=true -o Acquire::Retries=3 &&
              sudo timeout 300 apt-get install -y -qq -o Acquire::ForceIPv4=true -o Acquire::Retries=3 \
                --no-install-recommends ffmpeg
          }
          if ! install_ffmpeg; then
            echo "apt failed against the default mirror; retrying via archive.ubuntu.com"
            sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' \
              /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            install_ffmpeg || { sleep 30; install_ffmpeg; }
          fi
          ffmpeg -version | head -1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build web
        run: pnpm exec vite build

      - name: Build storage
        run: pnpm exec tsc -p storage/tsconfig.json
