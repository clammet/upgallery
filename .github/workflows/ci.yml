name: CI

# Validates every pull request (including Renovate's automated dependency
# bumps) with the typecheck, test suite, and production builds. The Docker
# image build in docker.yml also runs on pull requests and is the check that
# actually exercises the sharp/libvips/HEIC stack.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      # The storage tests shell out to ffmpeg (present in the production
      # image via apk, but not on the hosted runner). Apt mirrors on hosted
      # runners occasionally hang without timing out, so bound every fetch
      # and the step itself rather than stalling the job for hours.
      - name: Install ffmpeg
        timeout-minutes: 8
        run: |
          APT_OPTS='-o Acquire::http::Timeout=30 -o Acquire::Retries=3'
          for attempt in 1 2 3; do
            sudo apt-get update -qq $APT_OPTS \
              && sudo apt-get install -y -qq $APT_OPTS --no-install-recommends ffmpeg \
              && break
            echo "apt attempt $attempt failed; retrying" && sleep 10
          done
          ffmpeg -version | head -1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build web
        run: pnpm exec vite build

      - name: Build storage
        run: pnpm exec tsc -p storage/tsconfig.json
