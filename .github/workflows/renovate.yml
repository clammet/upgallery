name: Renovate

# Self-hosted Renovate: the same engine Mend runs, executed in this repo's
# own Actions on a schedule, so no third-party service holds write access.
# Authenticates as a self-owned GitHub App (variable RENOVATE_APP_CLIENT_ID,
# secret RENOVATE_APP_PRIVATE_KEY) rather than GITHUB_TOKEN, because PRs opened
# with GITHUB_TOKEN would not trigger the CI workflows that gate automerge.
# Repo-level behavior (automerge policy, the libvips custom manager, lockfile
# maintenance) lives in renovate.json at the repo root.

on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:
    inputs:
      log_level:
        description: Renovate log level
        default: info
        type: choice
        options: [info, debug]

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

env:
  # Exact Renovate engine pin; the action's own default is the floating `44`
  # tag. Renovate bumps it weekly through the customManagers:githubActionsVersions
  # preset in the repo's Renovate config (the annotation must stay on the line
  # directly above the variable).
  # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate
  RENOVATE_VERSION: 44.43.0

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      # GitHub disables cron triggers after 60 days without repository
      # activity. Re-enabling an active workflow resets that clock, so this
      # keeps every scheduled workflow alive while leaving manually disabled
      # ones alone.
      - name: Keep scheduled workflows alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows" \
            --jq '.workflows[] | select(.state == "active" or .state == "disabled_inactivity") | .id' \
          | while read -r id; do
              gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${id}/enable"
            done

      # Renovate's documented GitHub App permissions: Administration R,
      # Checks RW, Commit statuses RW, Contents RW, Dependabot alerts R,
      # Issues RW, Members R, Metadata R, Pull requests RW, and Workflows RW.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - uses: renovatebot/github-action@39b914146caeff8cd512e61c8992f1d5913af85c # v46.2.5
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: ${{ env.RENOVATE_VERSION }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
