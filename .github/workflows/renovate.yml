name: Renovate


on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      log_level:
        description: Renovate log level
        default: info
        type: choice
        options: [info, debug]

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  renovate:
    uses: yuzuyuzuyu/repo-automation/.github/workflows/renovate-runner.yml@a57240cdeefc9253ed7930312b445a9a0999657b # v1.0.5
    with:
      app-client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
      native-automerge: true
      log_level: ${{ inputs.log_level || 'info' }}
    secrets:
      RENOVATE_APP_PRIVATE_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
      RENOVATE_GITHUB_LOOKUP_TOKEN: ${{ secrets.RENOVATE_GITHUB_LOOKUP_TOKEN }}
