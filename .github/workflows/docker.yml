name: Docker images

# On pull requests the images are built but not pushed: this is the check
# that proves a dependency bump (sharp, libvips, base image) still compiles
# and passes the in-image HEIC verification before it can merge.
# Publication on main deploys Convex for the same commit before any image push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  # Finish production deployments and publication; only supersede PR builds.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  publication-ready:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the current revision and its CI
        id: gate
        uses: yuzuyuzuyu/repo-automation/actions/publication@ecf21e09c31ccb57e2d528ba7c1a1a7d56294744 # v1.0.12

  deploy-convex:
    needs: publication-ready
    if: needs.publication-ready.outputs.ready == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/convex-deploy.yml
    secrets:
      CONVEX_SELF_HOSTED_ADMIN_KEY: ${{ secrets.CONVEX_SELF_HOSTED_ADMIN_KEY }}

  build-and-push:
    needs: [publication-ready, deploy-convex]
    # A skipped backend deploy is allowed only for PRs, which never push images.
    # Match the deployment output to this build's commit, not just job success:
    # the deployment's own freshness gate can skip an obsolete revision.
    if: >-
      !cancelled() && needs.publication-ready.outputs.ready == 'true' &&
      (github.event_name == 'pull_request' ||
       (needs.deploy-convex.result == 'success' &&
        needs.deploy-convex.outputs.deployed-commit == github.sha))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built first: the storage target compiles libvips and Sharp, and the
      # web build reuses those shared stages from this job's local build cache.
      # no-cache-filters forces the runtime stage's `apk add` to re-run on
      # every build so the shared libraries sharp loads in production
      # (libheif, libjpeg-turbo, ...) are always current, while the expensive
      # libvips/sharp compile stages stay cached. cache-to only writes from
      # main so pull-request builds cannot evict that cache.
      - name: Build and push storage image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          pull: true
          no-cache: ${{ github.event_name == 'workflow_dispatch' }}
          context: .
          target: storage
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}/storage:latest
            ghcr.io/${{ github.repository }}/storage:${{ github.sha }}
          cache-from: type=gha,scope=storage
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,scope=storage,mode=max' || '' }}
          no-cache-filters: ${{ github.event_name != 'workflow_dispatch' && 'storage-runtime' || '' }}

      # The web image is deployment-agnostic: Convex and OAuth values are
      # injected at container startup as /config.json, not baked at build time.
      - name: Build and push web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          pull: true
          no-cache: ${{ github.event_name == 'workflow_dispatch' }}
          context: .
          target: web
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}/web:latest
            ghcr.io/${{ github.repository }}/web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,scope=web,mode=max' || '' }}

      # File-only artifact (FROM scratch, site under /srv/www) for deployments
      # whose primary web server serves the compiled site directly instead of
      # running the web image. Reuses the stages just built above, so this
      # step only assembles and pushes the export layer.
      - name: Build and push web-dist image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          pull: true
          no-cache: ${{ github.event_name == 'workflow_dispatch' }}
          context: .
          target: web-dist
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}/web-dist:latest
            ghcr.io/${{ github.repository }}/web-dist:${{ github.sha }}
          cache-from: type=gha,scope=web
