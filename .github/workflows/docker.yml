name: Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built first: the storage target compiles libvips and Sharp, and the
      # web build reuses those shared stages from this job's local build cache.
      - name: Build and push storage image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: storage
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/storage:latest
            ghcr.io/${{ github.repository }}/storage:${{ github.sha }}
          cache-from: type=gha,scope=storage
          cache-to: type=gha,scope=storage,mode=max

      # The web image is deployment-agnostic: Convex and OAuth values are
      # injected at container startup as /config.json, not baked at build time.
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/web:latest
            ghcr.io/${{ github.repository }}/web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # File-only artifact (FROM scratch, site under /srv/www) for deployments
      # whose primary web server serves the compiled site directly instead of
      # running the web image. Reuses the stages just built above, so this
      # step only assembles and pushes the export layer.
      - name: Build and push web-dist image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web-dist
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/web-dist:latest
            ghcr.io/${{ github.repository }}/web-dist:${{ github.sha }}
          cache-from: type=gha,scope=web
